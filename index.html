// =========================================================================
// PLAY HAND — Boss lifecycle through handlers only
// =========================================================================
window.playHand = () => {
  if (AppState.isScoring) return;
  const selectedCards = AppState.hand.filter((_, i) => AppState.selectedIndices.has(i));
  if (selectedCards.length === 0 || AppState.handsLeft <= 0) return;

  const classification = classifyHand(selectedCards);
  const handName = classification.name;

  const bossHandler = AppState.currentBoss && !hasAbility('chicot') ? BossHandlers[AppState.currentBoss.id] : null;
  if (bossHandler?.validate) {
    const err = bossHandler.validate({ selectedCards, handName });
    if (err) { showModal('🚫', err); return; }
  }

  AppState.isScoring = true;
  AppState.handsLeft--;
  AppState.stats.handsPlayed++;
  AppState.stats.handsPerType[handName] = (AppState.stats.handsPerType[handName] || 0) + 1;
  AppState.jokers.forEach(j => { if (JokerDefinitions[j.defId]?.effect === 'supernova') j.state.lastHandType = handName; });
  AppState.bossHandsPlayed.push(handName);
  if (!AppState.bossHandPlayed) AppState.bossHandPlayed = handName;

  // Spare Trousers gains its bonus from the Two Pair before this hand is scored,
  // so the triggering Two Pair receives the newly gained Mult.
  if (handName === 'Two Pair') {
    AppState.jokers.forEach(j => {
      const d = JokerDefinitions[j.defId];
      if (d?.effect === 'spareTrousers') j.state.value = (j.state.value || 0) + d.value;
    });
  }

  const result = resolveHand(selectedCards, false);

  // Apply money gained from Lucky / Gold / Gold Seals immediately
  AppState.money += result.moneyGained;

  // Track cards played (for Pillar)
  selectedCards.forEach(c => { if (!AppState.cardsPlayedThisAnte.includes(c.uid)) AppState.cardsPlayedThisAnte.push(c.uid); });

  // Run visual scoring sequence, then commit
  const appEl = document.getElementById('app');
  const handContainer = document.getElementById('handContainer');
  if (handContainer) handContainer.style.opacity = '0.15';

  const center = document.createElement('div');
  center.className = 'scoring-center';
  appEl.appendChild(center);

  const level = AppState.handLevels[handName] || 1;
  let runChips = result.baseChips, runMult = result.baseMult;

  center.innerHTML = `
    <div class="scoring-effect-label">${handName} (Lv.${level})</div>
    <div class="scoring-row-cards">
      ${result.scoringCards.map(card => {
        const isR = card.suit === '♥' || card.suit === '♦';
        return `<div class="scoring-card" data-uid="${card.uid}" data-suit="${card.suit}"><div class="rank-suit"><span class="rank ${isR?'red':'black'}">${card.rank}</span><span class="suit ${isR?'red':'black'}">${card.suit}</span></div></div>`;
      }).join('')}
    </div>
    <div class="scoring-chip-mult-row">
      <span class="scoring-chip-val" id="scoringChips">${runChips}</span>
      <span class="scoring-times-sym">×</span>
      <span class="scoring-mult-val" id="scoringMult">${runMult}</span>
    </div>`;

  const sequence = [
    ...result.cardEvents.map(e => ({ kind: 'card', data: e })),
    ...result.jokerEvents.map(e => ({ kind: 'joker', data: e })),
  ];

  let seqIdx = 0;
  function processNext() {
    if (seqIdx >= sequence.length) return showFinal();
    const step = sequence[seqIdx];
    if (step.kind === 'card') {
      const ev = step.data;
      const cards = center.querySelectorAll('.scoring-card');

      // Every scoring card gets its own moment in the spotlight.
      // Clear the previous card first so it returns to its normal size/position,
      // then raise only the card currently being scored.
      cards.forEach(el => {
        el.classList.remove('active', 'done');
      });

      const activeCard = Array.from(cards).find(
        el => el.dataset.uid === String(ev.cardUid)
      );
      if (activeCard) {
        activeCard.classList.add('active');

        // Unraise this card before the next scoring event begins.
        setTimeout(() => {
          activeCard.classList.remove('active');
        }, 300);
      }

      runChips += ev.chips || 0;
      runMult += ev.mult || 0;
      if (ev.multMult && ev.multMult !== 1) runMult = Math.floor(runMult * ev.multMult);
      const c = document.getElementById('scoringChips');
      const m = document.getElementById('scoringMult');
      if (c) c.textContent = runChips;
      if (m) m.textContent = runMult;
      playCardSound(seqIdx * 20); chipCountSound();
    } else {
      // Joker scoring should never leave the previously scored card raised.
      center.querySelectorAll('.scoring-card').forEach(el => {
        el.classList.remove('active', 'done');
      });

      const ev = step.data;
      const idx = AppState.jokers.findIndex(j => j.uid === ev.jokerUid);
      const slot = document.getElementById(`jokerSlot${idx}`);
      if (slot) { slot.classList.add('triggered'); setTimeout(() => slot.classList.remove('triggered'), 500); }
      runChips += ev.chipsDelta || 0;
      runMult += ev.multDelta || 0;
      if (ev.multMult && ev.multMult !== 1) runMult = Math.floor(runMult * ev.multMult);
      const moneyLine = ev.moneyDelta ? `<div style="margin-top:7px;color:var(--gold);font-family:var(--f-num);font-size:1.35rem;font-weight:900;text-shadow:0 0 14px rgba(255,201,74,.7)">💰 +$${ev.moneyDelta}</div>` : '';
      center.innerHTML = `
        <div class="scoring-joker-label">${ev.icon} ${ev.jokerName}</div>
        <div class="scoring-effect-label">${ev.text}</div>${moneyLine}
        <div class="scoring-chip-mult-row">
          <span class="scoring-chip-val">${runChips}</span>
          <span class="scoring-times-sym">×</span>
          <span class="scoring-mult-val">${runMult}</span>
        </div>`;
      multExplosionSound();
    }
    seqIdx++;
    setTimeout(processNext, 420);
  }

  function showFinal() {
    center.innerHTML = `
      <div class="scoring-effect-label">${handName}</div>
      <div class="scoring-chip-mult-row">
        <span class="scoring-chip-val">${result.chips}</span>
        <span class="scoring-times-sym">×</span>
        <span class="scoring-mult-val">${result.mult}</span>
      </div>
      <div class="scoring-total-big">${result.total.toLocaleString()}</div>`;
    multExplosionSound();

    // Update Joker state (real mutations) BEFORE committing hand
    updateJokerStates(selectedCards, result.scoringCards, handName);

    setTimeout(() => {
      AppState.score += result.total;
      AppState.totalScore += result.total;

      // 1) Destroy shattered glass
      const destroyed = selectedCards.filter(c => result.destroyedUids.has(c.uid));
      destroyed.forEach(() => { AppState.stats.glassDestroyed++; AppState.stats.cardsDestroyed++; });

      // 2) Move played cards to discard pile (those not shattered)
      const toDiscard = selectedCards.filter(c => !result.destroyedUids.has(c.uid));
      AppState.discardPile.push(...toDiscard);

      // 3) Compute remaining hand (this is the ARRAY that boss handlers will mutate)
      const remainingHand = AppState.hand.filter((_, i) => !AppState.selectedIndices.has(i));

      // 4) Boss onAfterPlay: passes the actual remaining hand
      if (bossHandler?.onAfterPlay) {
        bossHandler.onAfterPlay({
          handName,
          selectedCards,
          remainingHand,
          discardPile: AppState.discardPile,
        });
      }
      // 5) Boss onAfterScore
      if (bossHandler?.onAfterScore) bossHandler.onAfterScore({ handName });

      // 6) Boss: Crimson Heart — via single handler invocation
      if (bossHandler?.onHandPlayed) bossHandler.onHandPlayed({ handName });

      // 7) Draw replacements
      let drawCount;
      if (bossHandler?.getDrawCount) drawCount = bossHandler.getDrawCount();
      else drawCount = Math.max(0, calcHandSize() - remainingHand.length);
      const drawn = drawCards(drawCount);
      AppState.hand = remainingHand.concat(drawn);
      AppState.hand.forEach(c => applyBossDebuff(c));
      sortHand();

      // 8) Re-apply forced selection for Cerulean Bell
      AppState.selectedIndices.clear();
      if (AppState.forceSelectedUid !== null) {
        const fidx = AppState.hand.findIndex(c => c.uid === AppState.forceSelectedUid);
        if (fidx >= 0) AppState.selectedIndices.add(fidx);
        else AppState.forceSelectedUid = null;
      }

      AppState.isScoring = false;
      center.remove();
      if (handContainer) handContainer.style.opacity = '1';

      if (AppState.score >= AppState.targetScore) {
        AppState.blindStatus[AppState.blindIndex] = true;
        AppState.currentScreen = 'ROUND_OVER';
      } else if (AppState.handsLeft <= 0) {
        const bones = getActiveJokers().find(a=>a.def.effect==='mrBones');
        if (bones && AppState.score >= AppState.targetScore*0.25) {
          const idx=AppState.jokers.findIndex(j=>j.uid===bones.instance.uid); if(idx>=0)AppState.jokers.splice(idx,1);
          AppState.currentScreen='SHOP'; AppState.money=0;
        } else AppState.currentScreen = 'GAME_OVER';
      }
      render();
    }, 1400);
  }

  processNext();
};

window.discardHand = () => {
  if (AppState.isScoring) return;
  if (AppState.discardsLeft <= 0) return;
  const selectedCards = AppState.hand.filter((_, i) => AppState.selectedIndices.has(i));
  const discardVisuals = [...AppState.selectedIndices].map(i => {
    const el = document.querySelector(`.hand-card-wrapper[data-index="${i}"]`);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return { r, rotation: (el.style.transform.match(/rotate\((-?[\d.]+)deg\)/)||[])[1] || 0, html: el.querySelector('.card')?.outerHTML || '' };
  }).filter(Boolean);
  if (selectedCards.length === 0) return;
  // Cerulean Bell: must not discard forced card
  if (AppState.forceSelectedUid !== null && selectedCards.some(c => c.uid === AppState.forceSelectedUid)) {
    showModal('🔔', 'The forced card cannot be discarded.');
    return;
  }
  AppState.discardsLeft--;
  AppState.stats.discardsUsed++;
  AppState.stats.roundDiscardsUsed++;

  AppState.jokers.forEach(j => {
    const def = JokerDefinitions[j.defId];
    if (def?.effect === 'greenJoker') j.state.value = Math.max(0, (j.state.value || 0) - 1);
  });
  selectedCards.forEach(c => { if (c.rank === 'J') AppState.stats.jacksDiscarded++; });
  selectedCards.forEach(c => {
    if (c.seal === 'purple' && AppState.consumables.length < calcConsumableSlots()) {
      const t = randPick(Object.values(TarotDefinitions));
      AppState.consumables.push({ uid: 'c'+Math.floor(rng()*1000000), defId: t.id, type: 'tarot' });
    }
  });

  const remainingHand = AppState.hand.filter((_, i) => !AppState.selectedIndices.has(i));
  AppState.discardPile.push(...selectedCards);
  const bossHandler = AppState.currentBoss && !hasAbility('chicot') ? BossHandlers[AppState.currentBoss.id] : null;
  let drawCount;
  if (bossHandler?.getDrawCount) drawCount = bossHandler.getDrawCount();
  else drawCount = Math.max(0, calcHandSize() - remainingHand.length);
  const drawn = drawCards(drawCount);
  AppState.hand = remainingHand.concat(drawn);
  AppState.hand.forEach(c => applyBossDebuff(c));
  sortHand();

  AppState.selectedIndices.clear();
  if (AppState.forceSelectedUid !== null) {
    const fidx = AppState.hand.findIndex(c => c.uid === AppState.forceSelectedUid);
    if (fidx >= 0) AppState.selectedIndices.add(fidx);
    else AppState.forceSelectedUid = null;
  }

  render();

  // Animate the discarded cards independently so the new hand can render immediately.
  discardVisuals.forEach(({r, rotation, html}, n) => {
    if (!html) return;
    const template = document.createElement('template');
    template.innerHTML = html;
    const flyer = template.content.firstElementChild;
    if (!flyer) return;
    flyer.classList.remove('selected');
    const flyerWrap = document.createElement('div');
    flyerWrap.className = 'discard-flyer';
    flyerWrap.style.setProperty('--start-x', `${r.left}px`);
    flyerWrap.style.setProperty('--start-y', `${r.top}px`);
    flyerWrap.style.setProperty('--dx', `${window.innerWidth - r.left + 90 + n * 18}px`);
    flyerWrap.style.setProperty('--dy', `${Math.max(55, window.innerHeight * 0.38 - r.top)}px`);
    flyerWrap.style.setProperty('--delay', `${n * 105}ms`);
    flyerWrap.style.setProperty('--start-r', `${rotation}deg`);
    flyerWrap.style.setProperty('--spin', `${(n % 2 ? 1 : -1) * (8 + n * 3)}deg`);
    flyerWrap.appendChild(flyer);
    document.body.appendChild(flyerWrap);
    flyerWrap.addEventListener('animationend', () => flyerWrap.remove(), {once:true});
  });

  // Bring replacement cards up from below, one at a time, after the discard line finishes.
  // Hide them immediately after render so they cannot flash into view before the animation.
  const newCards = drawn.map(card =>
    document.querySelector(`.hand-card-wrapper[data-uid="${card.uid}"]`)
  ).filter(Boolean);
  const discardStagger = 105;
  const discardDuration = 500;
  const gapAfterDiscard = 120;
  const newStagger = 105;
  const newDuration = 420;
  const discardSequenceEnd = discardDuration + Math.max(0, discardVisuals.length - 1) * discardStagger;

  newCards.forEach((el, index) => {
    // The card is rendered in its final position, but kept completely invisible
    // until its individual entrance begins.
    el.style.opacity = '0';
    el.style.visibility = 'hidden';
    el.style.pointerEvents = 'none';

    const finalTransform = getComputedStyle(el).transform === 'none'
      ? el.style.transform
      : el.style.transform;
    const overlapLead = 210;
    const delay = Math.max(0, overlapLead + index * newStagger);

    setTimeout(() => {
      el.style.visibility = 'visible';
      el.style.opacity = '0';

      // Force the browser to commit the hidden state before starting the animation.
      void el.offsetWidth;

      const animation = el.animate([
        { transform: 'translate3d(0, 130px, 0) scale(.94)', opacity: 0 },
        { transform: 'translate3d(0, 18px, 0) scale(.985)', opacity: .72, offset: .62 },
        { transform: finalTransform, opacity: 1 }
      ], {
        duration: newDuration,
        easing: 'cubic-bezier(.16,.76,.22,1)',
        fill: 'forwards'
      });

      animation.finished.then(() => {
        el.style.transform = finalTransform;
        el.style.opacity = '1';
        el.style.visibility = 'visible';
        el.style.pointerEvents = '';
      });
    }, delay);
  });

};

// =========================================================================
// ROUND OVER / SHOP / GAME OVER
// =========================================================================
function renderRoundOver() {
  if (!AppState.roundRewardProcessed) {
    AppState.roundRewardProcessed = true;
    AppState.jokers.forEach(j => {
      if (j.perishable && j.perishableRounds !== undefined) j.perishableRounds--;
      if (j.rental) AppState.money = Math.max(-20, AppState.money - 3);
    });
  }
  const base = AppState.blindIndex === 0 ? 3 : AppState.blindIndex === 1 ? 4 : 5;
  const handsBonus = AppState.handsLeft;
  const interest = AppState.noInterest ? 0 : Math.min(Math.floor(AppState.money/5), 5);

  let endMoney = 0;
  AppState.jokers.forEach(j => {
    const def = JokerDefinitions[j.defId];
    if (!def) return;
    if (def.effect === 'roundMoney') endMoney += def.value;
    if (def.effect === 'scalingMoney') {
      const v = def.source === 'planetsUsed' ? AppState.stats.planetsUsed * def.value : (j.state.value !== undefined ? j.state.value : (def.start || 0));
      endMoney += v;
      j.state.value = v;
    }
  });

  let greenBonus = 0;
  if (AppState.deckId === 'green') greenBonus = AppState.handsLeft + AppState.discardsLeft;

  let goldMoney = 0;
  AppState.hand.forEach(c => {
    if (c.enhancement === 'gold') goldMoney += 3;
    if (c.seal === 'gold') goldMoney += 3;
  });
  AppState.jokers.forEach(j => {
    const d=JokerDefinitions[j.defId];
    if(!d) return;
    if(d.effect==='cloud9') goldMoney += countDeckCards(c=>c.rank==='9');
    if(d.effect==='rocket') goldMoney += (j.state.payout || 1);
    if(d.effect==='toTheMoon') goldMoney += Math.floor(Math.max(0,AppState.money)/5);
    if(d.effect==='delayedGratification' && AppState.stats.roundDiscardsUsed===0) goldMoney += AppState.discardsLeft*2;
  });
  const totalReward = base + handsBonus + interest + endMoney + greenBonus + goldMoney;

  screenContainer.innerHTML = `
    <div class="overlay">
      <h2 style="color:var(--gold);">ROUND CLEARED!</h2>
      <div class="stat-row"><span>Base</span><span>$${base}</span></div>
      <div class="stat-row"><span>Hands Bonus</span><span>$${handsBonus}</span></div>
      <div class="stat-row"><span>Interest</span><span>$${interest}</span></div>
      ${endMoney>0?`<div class="stat-row" style="color:var(--gold)"><span>Joker Earnings</span><span>+$${endMoney}</span></div>`:''}
      ${greenBonus>0?`<div class="stat-row"><span>Green Deck</span><span>+$${greenBonus}</span></div>`:''}
      ${goldMoney>0?`<div class="stat-row"><span>Gold</span><span>+$${goldMoney}</span></div>`:''}
      <div class="stat-row" style="font-size:1.4rem;font-weight:800;"><span>TOTAL</span><span>$${totalReward}</span></div>
      <button class="primary" onclick="collectReward(${totalReward})">COLLECT</button>
    </div>`;
}
window.collectReward = (amt) => {
  AppState.money += amt;
  // Boss card debuffs/face-down states must never leak into the shop or next blind.
  [...AppState.deck, ...AppState.hand, ...AppState.discardPile].forEach(c => { c.faceDown = false; if (!AppState.verdantLeafActive) c.debuffed = false; });
  AppState.blindIndex++;
  AppState.score = 0;
  if (AppState.blindIndex > 2) {
    AppState.ante++;
    AppState.blindIndex = 0;
    AppState.blindStatus = [false,false,false];
    AppState.currentBoss = null;
  }
  AppState.currentScreen = 'SHOP'; render();
};

function generateShopItems() {
  const items = [];
  const discount = AppState.vouchers.includes('liquidation') ? 0.5 : (AppState.vouchers.includes('clearance') ? 0.25 : 0);
  const jokerPool = Object.values(JokerDefinitions).filter(d => d.cost <= 8 && d.rarity !== 'Legendary');
  for (let i = 0; i < 2; i++) {
    const j = randPick(jokerPool);
    items.push({ kind: 'joker', defId: j.id, cost: Math.max(1, Math.floor(j.cost * (1 - discount))), icon: j.icon, name: j.name, desc: j.desc, rarity: j.rarity });
  }
  const t = randPick(Object.values(TarotDefinitions));
  items.push({ kind: 'tarot', defId: t.id, cost: Math.max(0, Math.floor(t.cost*(1-discount))), icon: t.icon, name: t.name, desc: t.desc });
  const p = randPick(Object.values(PlanetDefinitions));
  items.push({ kind: 'planet', defId: p.id, cost: AppState.vouchers.includes('astronomer') ? 0 : Math.max(0, Math.floor(p.cost*(1-discount))), icon: p.icon, name: p.name, desc: `Level up ${p.hand}` });
  const tarotWeight = AppState.vouchers.includes('tarottycoon') ? 4 : AppState.vouchers.includes('tarotmerchant') ? 2 : 1;
  const planetWeight = AppState.vouchers.includes('planettycoon') ? 4 : AppState.vouchers.includes('planetmerchant') ? 2 : 1;
  for(let w=1; w<tarotWeight && items.length<8; w++){ const q=randPick(Object.values(TarotDefinitions)); items.push({kind:'tarot',defId:q.id,cost:Math.max(0,Math.floor(q.cost*(1-discount))),icon:q.icon,name:q.name,desc:q.desc}); }
  for(let w=1; w<planetWeight && items.length<8; w++){ const q=randPick(Object.values(PlanetDefinitions)); items.push({kind:'planet',defId:q.id,cost:AppState.vouchers.includes('astronomer')?0:Math.max(0,Math.floor(q.cost*(1-discount))),icon:q.icon,name:q.name,desc:`Level up ${q.hand}`}); }
  if (AppState.deckId === 'ghost' || rng() < 0.3) {
    const s = randPick(Object.values(SpectralDefinitions));
    items.push({ kind: 'spectral', defId: s.id, cost: Math.max(1, Math.floor(s.cost*(1-discount))), icon: s.icon, name: s.name, desc: s.desc });
  }
  const ownedIds = AppState.vouchers;
  const vpool = Object.values(VoucherDefinitions).filter(v => {
    if (v.tier === 2) {
      const base = Object.values(VoucherDefinitions).find(b => b.upgrade === v.id);
      return base && ownedIds.includes(base.id);
    }
    return !ownedIds.includes(v.id);
  });
  if (vpool.length > 0) {
    const v = randPick(vpool);
    items.push({ kind: 'voucher', defId: v.id, cost: v.cost, icon: v.icon, name: v.name, desc: v.desc });
  }
  const maxSlots = 6 + (AppState.vouchers.includes('overstockplus') ? 2 : AppState.vouchers.includes('overstock') ? 1 : 0);
  return items.slice(0,maxSlots);
}

function renderShop() {
  if (AppState.shopItems.length === 0) AppState.shopItems = generateShopItems();
  screenContainer.innerHTML = `
    <h2 style="color:var(--gold);text-align:center;">SHOP</h2>
    <p style="text-align:center;">💰 $${AppState.money}</p>
    <div>
      ${AppState.shopItems.map((item, i) => `
        <div class="shop-item ${item.kind==='voucher'?'voucher':''}" data-kind="${item.kind}" data-rarity="${item.rarity||''}">
          <div><span class="item-icon">${item.icon}</span> <span class="item-name">${item.name}</span><div class="item-desc">${item.desc}</div></div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="item-cost">$${item.cost}</span>
            <button class="small primary" onclick="buyItem(${i})" ${AppState.money<item.cost?'disabled':''}>BUY</button>
          </div>
        </div>`).join('')}
    </div>
    <div class="shop-capacity-panel">
      <div class="shop-capacity-title">CONSUMABLE SLOTS <span>${AppState.consumables.length} / ${calcConsumableSlots()}</span></div>
      <div class="shop-capacity-slots">
        ${Array(calcConsumableSlots()).fill(0).map((_, slotIndex) => {
          const c = AppState.consumables[slotIndex];
          const def = c
            ? (c.type === 'tarot' ? TarotDefinitions[c.defId] : c.type === 'spectral' ? SpectralDefinitions[c.defId] : PlanetDefinitions[c.defId])
            : null;
          return c
            ? `<div class="shop-consumable-slot filled" onclick="openConsumableTargeting(${slotIndex})">
                <span class="shop-consumable-icon">${def?.icon || '🔮'}</span>
                <span class="shop-consumable-name">${def?.name || '?'}</span>
              </div>`
            : `<div class="shop-consumable-slot empty"><span>+</span><small>EMPTY</small></div>`;
        }).join('')}
      </div>
    </div>
    <h3 style="color:var(--gold);margin-top:12px;">YOUR JOKERS</h3>
    <div class="joker-row">
      ${AppState.jokers.map((j,i) => {
        const def = JokerDefinitions[j.defId] || { icon:'🃏', name:'?' };
        return `<div class="joker-slot filled" data-rarity="${def.rarity||'Common'}" onclick="sellJokerFromShop(${i})"><span class="joker-icon">${def.icon}</span><span class="joker-name">${def.name}</span></div>`;
      }).join('') || '<span style="opacity:0.5;">No Jokers</span>'}
    </div>
    ${AppState.consumables.length ? `
      <h3 style="color:var(--gold);margin-top:12px;">CONSUMABLES</h3>
      <div class="consumable-row">
        ${AppState.consumables.map((c,i) => {
          const def = c.type === 'tarot' ? TarotDefinitions[c.defId] : c.type === 'spectral' ? SpectralDefinitions[c.defId] : PlanetDefinitions[c.defId];
          return `<div class="consumable-slot" onclick="openConsumableTargeting(${i})"><span style="font-size:1.2rem;">${def?.icon || '🔮'}</span><span style="font-size:0.45rem;">${def?.name || '?'}</span></div>`;
        }).join('')}
      </div>` : ''}
    <button class="primary" style="margin-top:16px;" onclick="nextRound()">NEXT ROUND</button>
    <button style="margin-top:4px;" onclick="rerollShop()">REROLL (${AppState.vouchers.includes('rerollglut')?'FREE':AppState.vouchers.includes('reroll')?'$1':'$2'})</button>
  `;
}

window.buyItem = (i) => {
  const item = AppState.shopItems[i];
  if (!item || AppState.money < item.cost) return;
  AppState.money -= item.cost;
  if (item.kind === 'joker') {
    if (AppState.jokers.length >= calcJokerSlots()) { showModal('❌','No Joker slots!'); AppState.money += item.cost; return; }
    AppState.jokers.push(createJokerInstance(item.defId));
  } else if (item.kind === 'voucher') {
    if (!AppState.vouchers.includes(item.defId)) AppState.vouchers.push(item.defId);
    showModal('🎫', `${item.name} activated!`);
  } else {
    if (AppState.consumables.length >= calcConsumableSlots()) { showModal('❌','No Consumable slots!'); AppState.money += item.cost; return; }
    AppState.consumables.push({ uid: 'c'+Math.floor(rng()*1000000), defId: item.defId, type: item.kind });
  }
  AppState.shopItems.splice(i,1);
  shopBuySound();
  renderShop();
};
window.sellJokerFromShop = (i) => {
  const j = AppState.jokers[i]; if (!j) return;
  const def = JokerDefinitions[j.defId];
  AppState.money += Math.floor(def.cost/2);
  AppState.jokers.splice(i,1);
  if (AppState.verdantLeafActive) {
    AppState.verdantLeafActive = false;
    AppState.currentBoss = null;
    [...AppState.deck, ...AppState.hand, ...AppState.discardPile].forEach(c => c.debuffed = false);
  }
  renderShop();
};
window.rerollShop = () => { if (AppState.money >= 2) { AppState.money -= 2; AppState.shopItems = []; renderShop(); } };
window.nextRound = () => { AppState.shopItems = []; AppState.score = 0; AppState.currentScreen = 'BLIND_SELECT'; render(); };

// =========================================================================
// CONSUMABLE TARGETING
// =========================================================================
window.openConsumableTargeting = (idx) => {
  const c = AppState.consumables[idx]; if (!c) return;
  const def = c.type === 'tarot' ? TarotDefinitions[c.defId] : c.type === 'spectral' ? SpectralDefinitions[c.defId] : PlanetDefinitions[c.defId];
  AppState.pendingConsumable = { ...def, type: c.type };
  AppState.pendingInventoryIndex = idx;
  AppState.pendingTargets = [];
  if (!def.targetCount) {
    applyConsumable(def, []);
    AppState.consumables.splice(idx,1);
    AppState.pendingConsumable = null;
    AppState.pendingInventoryIndex = -1;
    render(); return;
  }
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'targetingModal';
  modal.innerHTML = `<div class="modal-box" style="max-width:380px;"><h3>${def.icon} ${def.name}</h3><p style="font-size:0.8rem;">${def.desc}</p><div class="target-prompt">Select ${def.targetCount} card${def.targetCount>1?'s':''}</div><div class="card-picker">
    ${AppState.hand.map((card, i) => `<div class="card" data-ti="${i}" data-suit="${card.suit}" onclick="toggleTarget(${i})"><div class="rank-suit"><span class="rank ${card.suit==='♥'||card.suit==='♦'?'red':'black'}">${card.rank}</span><span class="suit ${card.suit==='♥'||card.suit==='♦'?'red':'black'}">${card.suit}</span></div></div>`).join('')}
  </div><div class="modal-actions" style="margin-top:12px;"><button class="primary small" onclick="confirmTargets()">CONFIRM</button><button class="small" onclick="cancelTargets()">CANCEL</button></div></div>`;
  document.getElementById('app').appendChild(modal);
};
window.toggleTarget = (i) => {
  if (!AppState.pendingConsumable) return;
  const max = AppState.pendingConsumable.targetCount;
  const idx = AppState.pendingTargets.indexOf(i);
  if (idx >= 0) AppState.pendingTargets.splice(idx,1);
  else if (AppState.pendingTargets.length < max) AppState.pendingTargets.push(i);
  document.querySelectorAll('#targetingModal .card').forEach((el, j) => el.classList.toggle('selected', AppState.pendingTargets.includes(j)));
};
window.confirmTargets = () => {
  if (!AppState.pendingConsumable) return;
  if (AppState.pendingTargets.length !== AppState.pendingConsumable.targetCount) { showModal('❌', 'Select exactly '+AppState.pendingConsumable.targetCount); return; }
  const cards = AppState.pendingTargets.map(i => AppState.hand[i]);
  applyConsumable(AppState.pendingConsumable, cards);
  if (AppState.pendingInventoryIndex >= 0) AppState.consumables.splice(AppState.pendingInventoryIndex, 1);
  AppState.pendingConsumable = null;
  AppState.pendingTargets = [];
  AppState.pendingInventoryIndex = -1;
  document.getElementById('targetingModal')?.remove();
  render();
};
window.cancelTargets = () => {
  AppState.pendingConsumable = null;
  AppState.pendingTargets = [];
  AppState.pendingInventoryIndex = -1;
  document.getElementById('targetingModal')?.remove();
};

function applyConsumable(def, targets) {
  const effect = def.effect;
  AppState.lastConsumableUsed = def;
  if (def.hand !== undefined) {
    if (AppState.handLevels[def.hand] !== undefined) {
      AppState.handLevels[def.hand] += 1;
      AppState.stats.planetsUsed++;
      showModal('🪐', `${def.hand} → Lv.${AppState.handLevels[def.hand]}`);
    }
    return;
  }
  if (def.icon === '🔮') AppState.stats.tarotsUsed++;
  switch (effect) {
    case 'doubleMoney': AppState.money = Math.min(AppState.money*2, 20); showModal('🔮', `Money → $${AppState.money}!`); return;
    case 'moneyFromJokers': {
      let total = 0;
      AppState.jokers.forEach(j => { const d = JokerDefinitions[j.defId]; if (d) total += Math.floor(d.cost/2); });
      total = Math.min(total, 50);
      AppState.money += total;
      showModal('🔮', `+$${total}!`); return;
    }
    case 'createPlanets': {
      for (let i=0;i<2 && AppState.consumables.length<calcConsumableSlots();i++) {
        const p = randPick(Object.values(PlanetDefinitions));
        AppState.consumables.push({ uid:'c'+Math.floor(rng()*1000000), defId: p.id, type:'planet' });
      }
      showModal('🔮','Created 2 Planets!'); return;
    }
    case 'createTarots': {
      for (let i=0;i<2 && AppState.consumables.length<calcConsumableSlots();i++) {
        const t = randPick(Object.values(TarotDefinitions));
        AppState.consumables.push({ uid:'c'+Math.floor(rng()*1000000), defId: t.id, type:'tarot' });
      }
      showModal('🔮','Created 2 Tarots!'); return;
    }
    case 'createJoker': {
      if (AppState.jokers.length >= calcJokerSlots()) { showModal('❌','No slots!'); return; }
      const rare = Object.values(JokerDefinitions).filter(d => d.rarity === 'Rare' || d.rarity === 'Legendary');
      const j = randPick(rare);
      AppState.jokers.push(createJokerInstance(j.id));
      showModal('🔮', `Created ${j.name}!`); return;
    }
    case 'createRareJoker': {
      if (AppState.jokers.length >= calcJokerSlots()) return;
      const rare = Object.values(JokerDefinitions).filter(d => d.rarity === 'Rare');
      const j = randPick(rare);
      AppState.jokers.push(createJokerInstance(j.id));
      AppState.money = 0;
      showModal('👻', `Created ${j.name}! Cash → $0.`); return;
    }
    case 'createLegendary': {
      if (AppState.jokers.length >= calcJokerSlots()) return;
      const leg = Object.values(JokerDefinitions).filter(d => d.rarity === 'Legendary');
      const j = randPick(leg);
      AppState.jokers.push(createJokerInstance(j.id));
      showModal('👻', `Created ${j.name}!`); return;
    }
    case 'copyLast': if (AppState.lastConsumableUsed) applyConsumable(AppState.lastConsumableUsed, []); return;
    case 'wheelOfFortune': {
      if (AppState.jokers.length === 0) return;
      if (rng() < 0.25) {
        const j = randPick(AppState.jokers);
        j.edition = randPick(['foil','holo','poly']);
        showModal('🔮', `${JokerDefinitions[j.defId].name} got ${j.edition}!`);
      } else showModal('🔮', 'No luck...');
      return;
    }
    case 'addEdition': if (targets[0]) { targets[0].edition = randPick(['foil','holo','poly']); showModal('👻', `${targets[0].edition} added!`); } return;
    case 'addPolyEdition': {
      if (AppState.jokers.length === 0) return;
      const kept = randPick(AppState.jokers);
      kept.edition = 'poly';
      AppState.jokers = [kept];
      showModal('👻', `${JokerDefinitions[kept.defId].name} → Poly!`); return;
    }
    case 'addNegative': {
      if (AppState.jokers.length === 0) return;
      const j = randPick(AppState.jokers);
      j.edition = 'negative';
      showModal('👻', `Negative! +1 Joker slot`); return;
    }
    case 'copyJoker': {
      if (AppState.jokers.length === 0 || AppState.jokers.length >= calcJokerSlots()) return;
      const j = randPick(AppState.jokers);
      AppState.jokers = [createJokerInstance(j.defId, { edition: j.edition })];
      showModal('👻', `Kept only ${JokerDefinitions[j.defId].name}!`); return;
    }
    case 'convertAllSuit': {
      const s = randPick(SUITS);
      AppState.hand.forEach(c => { c.suit = s; });
      showModal('👻', `All → ${s}!`); return;
    }
    case 'convertAllRank': {
      const r = randPick(RANKS);
      AppState.hand.forEach(c => { c.rank = r; });
      AppState.stats.ouijaReduction = (AppState.stats.ouijaReduction || 0) + 1;
      showModal('👻', `All → ${r}! -1 Hand Size.`); return;
    }
    case 'destroy5Money': {
      for (let i=0;i<5 && AppState.hand.length>0;i++) { AppState.hand.pop(); AppState.stats.cardsDestroyed++; }
      AppState.money += 20;
      showModal('👻','Destroyed 5, +$20!'); return;
    }
    case 'destroyAddFace': case 'destroyAddAce': case 'destroyAddNumber': {
      if (AppState.hand.length > 0) { AppState.hand.pop(); AppState.stats.cardsDestroyed++; }
      const n = effect === 'destroyAddFace' ? 3 : effect === 'destroyAddAce' ? 2 : 4;
      for (let i=0;i<n;i++) {
        let rank;
        if (effect === 'destroyAddFace') rank = randPick(['J','Q','K']);
        else if (effect === 'destroyAddAce') rank = 'A';
        else rank = randPick(['2','3','4','5','6','7','8','9','10']);
        AppState.hand.push(createCard(rank, randPick(SUITS), { enhancement:'bonus' }));
        AppState.stats.cardsAdded++;
      }
      showModal('👻', `Added ${n} enhanced cards!`); return;
    }
    case 'copyCardTwice': {
      if (targets.length === 0) return;
      const c = targets[0];
      AppState.hand.push(cloneCard(c), cloneCard(c));
      AppState.stats.cardsAdded += 2;
      showModal('👻','Created 2 copies!'); return;
    }
    case 'upgradeAllHands': {
      Object.keys(AppState.handLevels).forEach(h => AppState.handLevels[h] += 1);
      AppState.stats.planetsUsed += 12;
      showModal('👻','All hands +1!'); return;
    }
    case 'enhanceLucky': targets.forEach(c => c.enhancement = 'lucky'); showModal('🔮','→ Lucky'); return;
    case 'enhanceMult': targets.forEach(c => c.enhancement = 'mult'); showModal('🔮','→ Mult'); return;
    case 'enhanceBonus': targets.forEach(c => c.enhancement = 'bonus'); showModal('🔮','→ Bonus'); return;
    case 'enhanceWild': targets.forEach(c => c.enhancement = 'wild'); showModal('🔮','→ Wild'); return;
    case 'enhanceSteel': targets.forEach(c => c.enhancement = 'steel'); showModal('🔮','→ Steel'); return;
    case 'enhanceGlass': targets.forEach(c => c.enhancement = 'glass'); showModal('🔮','→ Glass'); return;
    case 'enhanceGold': targets.forEach(c => c.enhancement = 'gold'); showModal('🔮','→ Gold'); return;
    case 'enhanceStone': targets.forEach(c => c.enhancement = 'stone'); showModal('🔮','→ Stone'); return;
    case 'increaseRank': targets.forEach(c => { const i = RANKS.indexOf(c.rank); if (i < RANKS.length-1) c.rank = RANKS[i+1]; }); showModal('🔮','Rank +1'); return;
    case 'destroyCards': {
      targets.forEach(c => {
        const i = AppState.hand.indexOf(c);
        if (i >= 0) { AppState.hand.splice(i,1); AppState.stats.cardsDestroyed++; }
        const di = AppState.deck.indexOf(c);
        if (di >= 0) { AppState.deck.splice(di,1); AppState.stats.cardsDestroyed++; }
      });
      showModal('🔮', `Destroyed ${targets.length}!`); return;
    }
    case 'cloneCard': {
      if (targets.length < 2) return;
      const source = targets[1];
      const idx = AppState.hand.indexOf(targets[0]);
      if (idx >= 0) AppState.hand[idx] = cloneCard(source);
      showModal('🔮','Cloned!'); return;
    }
    case 'suitDiamond': targets.forEach(c => c.suit = '♦'); showModal('🔮','→ ♦'); return;
    case 'suitClub': targets.forEach(c => c.suit = '♣'); showModal('🔮','→ ♣'); return;
    case 'suitHeart': targets.forEach(c => c.suit = '♥'); showModal('🔮','→ ♥'); return;
    case 'suitSpade': targets.forEach(c => c.suit = '♠'); showModal('🔮','→ ♠'); return;
    case 'addGoldSeal': targets.forEach(c => c.seal = 'gold'); showModal('👻','Gold Seal'); return;
    case 'addRedSeal': targets.forEach(c => c.seal = 'red'); showModal('👻','Red Seal'); return;
    case 'addBlueSeal': targets.forEach(c => c.seal = 'blue'); showModal('👻','Blue Seal'); return;
    case 'addPurpleSeal': targets.forEach(c => c.seal = 'purple'); showModal('👻','Purple Seal'); return;
  }
  showModal('✅','Applied!');
}

function showModal(title, msg) {
  const m = document.createElement('div');
  m.className = 'modal-overlay';
  m.innerHTML = `<div class="modal-box"><h3>${title}</h3><p>${msg}</p><div class="modal-actions"><button class="primary small" onclick="this.closest('.modal-overlay').remove()">OK</button></div></div>`;
  document.getElementById('app').appendChild(m);
  shopBuySound();
}

function renderHandLevelsView() {
  const sorted = Object.entries(AppState.handLevels).sort((a,b) => b[1]-a[1]);
  screenContainer.innerHTML = `

// A deterministic, non-RNG QA suite for all 150 Joker definitions.
function runJokerQATests(){
  const out=[]; const defs=Object.values(JokerDefinitions);
  if(defs.length!==150)out.push(`Registry has ${defs.length} Jokers, expected 150`);
  const ids=new Set(); defs.forEach(d=>{if(ids.has(d.id))out.push(`Duplicate id: ${d.id}`);ids.add(d.id);if(!JokerHandlers[d.effect])out.push(`${d.id}: missing handler ${d.effect}`);});
  const nullLike=['certificate','burglar','sixthSense','midasMask','luchador','giftCard','mailInRebate','toTheMoon','hallucination','showman','invisibleJoker','cartomancer','astronomer','burntJoker','riffRaff','dna','merryAndy','doubleProbabilities','matador','perkeo','chicot','ceremonialDagger','chaos','dietCola','faceless','hiker','marbleJoker','tradingCard'];
  nullLike.forEach(e=>{if(!JokerHandlers[e])out.push(`Lifecycle effect ${e} has no callable handler`);});
  // Direct trigger tests using isolated mock contexts.
  const mk=(id,ctx={})=>{const d=JokerDefinitions[id];const j=createJokerInstance(id);__initJokerState(j);const hand=(d.handType||'Two Pair');return {d,j,r:JokerHandlers[d.effect]?.(d,j,{handName:hand,scoringCards:[],heldCards:[],scoringUids:new Set(),isPreview:true,...ctx})};};
  const tests=[
    ['joker','flatMult',r=>r?.mult===4],
    ['moon','heldMult',r=>r===null||r.mult===13],
    ['baron','heldXMult',r=>r===null||r.multMult===1.5],
    ['jolly','handTypeMult',r=>r?.mult===8],
    ['clever','handTypeChips',r=>r?.chips===80],
    ['duo','handTypeXMult',r=>r?.multMult===2],
    ['half','handSizeMult',r=>r?.mult===20],
    ['fibonacci','rankMult',r=>r===null||r.mult===0||r.mult===8],
    ['bootstraps','bootstraps',r=>true],
    ['spareTrousers','spareTrousers',r=>r===null||typeof r.mult==='number'],
    ['hologram','scalingXMult',r=>r===null||typeof r.multMult==='number'],
    ['steeljoker','steelJoker',r=>r===null||typeof r.multMult==='number'],
  ];
  // shoot_the_moon is the displayed name; actual id is moon.
  tests.forEach(([id,effect,pred])=>{if(!JokerDefinitions[id])return;try{const x=mk(id);if(!pred(x.r))out.push(`${id}: trigger contract failed`);}catch(e){out.push(`${id}: ${e.message}`);}});
  return out;
}

// SNAPSHOT TEST HARNESS (Phase 0)
// Verifies resolver purity for preview and specific interactions
// =========================================================================
function runSnapshotTests() {
  const results = [];
  const card = (rank, suit, opts) => {
    const c = createCard(rank, suit, opts || {});
    return c;
  };

  // Test 1: Preview doesn't mutate AppState
  const savedMoney = AppState.money;
  const savedHand = AppState.hand.slice();
  const savedJokers = AppState.jokers.slice();
  const savedStats = JSON.stringify(AppState.stats);
  const testHand = [card('A','♠'), card('A','♥'), card('K','♦'), card('K','♣')];
  resolveHand(testHand, true);
  if (AppState.money !== savedMoney) results.push('❌ Preview mutated money');
  if (AppState.hand.length !== savedHand.length) results.push('❌ Preview mutated hand');
  if (JSON.stringify(AppState.stats) !== savedStats) results.push('❌ Preview mutated stats');
  if (AppState.jokers.length !== savedJokers.length) results.push('❌ Preview mutated jokers');

  // Test 2: Stone card always scores
  const stoneHand = [card('A','♠'), card('A','♥'), card('2','♣', { enhancement: 'stone' }), card('7','♦'), card('9','♠')];
  const cls = classifyHand(stoneHand);
  const stoneIncluded = stoneHand.some(c => c.enhancement === 'stone' && cls.scoringUids.has(c.uid));
  if (!stoneIncluded) results.push('❌ Stone card not in scoringUids');

  // Test 3: Hack ability is not treated as boolean
  if (typeof findAbilities('retriggerLowRanks') !== 'object') results.push('❌ findAbilities not returning array');

  // Test 4: Disabled Joker excluded
  AppState.jokers = [];
  const j1 = createJokerInstance('hack');
  AppState.jokers = [j1];
  const beforeDisable = getActiveJokers().length;
  AppState.disabledJokers.add(j1.uid);
  const afterDisable = getActiveJokers().length;
  if (beforeDisable !== 1 || afterDisable !== 0) results.push('❌ Disabled Joker not excluded from getActiveJokers');
  AppState.jokers = [];
  AppState.disabledJokers = new Set();

  // Test 5: Wild card flush detection
  const wildHand = [card('2','♠'), card('3','♠'), card('4','♠', { enhancement: 'wild' }), card('5','♠'), card('6','♠')];
  const wildCls = classifyHand(wildHand);
  if (wildCls.name !== 'Straight Flush' && wildCls.name !== 'Flush' && wildCls.name !== 'Straight') {
    results.push(`❌ Wild flush misclassified as ${wildCls.name}`);
  }

  return results;
}

/* ================================================================
   SHOP REWORK
   - Three sections: JOKERS / BOOSTER PACKS / VOUCHERS
   - No direct Planet/Tarot/Spectral shop entries
   - Vouchers are temporary and expire after the current Ante
   ================================================================ */
AppState.voucherExpirations = AppState.voucherExpirations || {};

function voucherActive(id) {
  return AppState.vouchers.includes(id) &&
    (!AppState.voucherExpirations || AppState.voucherExpirations[id] === undefined ||
     AppState.voucherExpirations[id] >= AppState.ante);
}

function shopDiscount() {
  if (voucherActive('liquidation')) return 0.50;
  if (voucherActive('clearance')) return 0.25;
  return 0;
}

function shopPrice(baseCost) {
  const raw = Math.max(1, Math.floor(baseCost * (1 - shopDiscount())));
  return raw;
}

function refreshShopPrices() {
  (AppState.shopItems || []).forEach(item => {
    if (item.baseCost !== undefined) item.cost = shopPrice(item.baseCost);
  });
}

function makeShopJoker(def) {
  const j = decorateShopJoker(def);
  return {
    kind:'joker', defId:def.id, baseCost:def.cost, cost:shopPrice(def.cost),
    icon:def.icon, name:def.name, desc:def.desc, rarity:def.rarity,
    shopJoker:j
  };
}

function makeStandardPack() {
  return { kind:'pack', packType:'standard', baseCost:4, cost:shopPrice(4),
    icon:'🂠', name:'Standard Pack', desc:'5 playing cards · choose up to 2' };

function generateReworkedShop() {
  const items = [];
  const jokerPool = Object.values(JokerDefinitions).filter(d => d.cost <= 8 && d.rarity !== 'Legendary');
  const jokerCount = voucherActive('overstockplus') ? 3 : 2;
  for (let i=0; i<jokerCount; i++) {
    const j = randPick(jokerPool);
    items.push(makeShopJoker(j));
  }
  // Booster slots rotate through every pack family instead of being locked to
  // Standard + Buffoon. This keeps Tarot, Planet, and Spectral packs available.
  const packFactories = [makeStandardPack, makeArcanaPack, makeCelestialPack, makeSpectralPack, makeBuffoonPack];
  const packChoices = shuffleArray(packFactories.slice());
  items.push(packChoices[0](), packChoices[1]());

  const owned = AppState.vouchers;
  const vpool = Object.values(VoucherDefinitions).filter(v => {
    if (v.tier === 2) {
      const base = Object.values(VoucherDefinitions).find(b => b.upgrade === v.id);
      return base && owned.includes(base.id);
    }
    return !owned.includes(v.id);
  });
  if (vpool.length) {
    const v = randPick(vpool);
    items.push({kind:'voucher',defId:v.id,baseCost:v.cost,cost:v.cost,icon:v.icon,name:v.name,desc:v.desc});
  }
  return items;
}

  } else if (p.type === 'buffoon') {
    const d = p.cards[p.selected[0]];

    const d = p.cards[p.selected[0]];
    if (AppState.consumables.length >= calcConsumableSlots()) showModal('❌','No Consumable slots. The pack card was not taken.');

        playTrackPluck(currentBarChord[2]*4,.22,.018,currentTrack);
      } else if(currentTrack.style==='space'){
        playTrackPluck(currentBarChord[1]*2,.18,.014,currentTrack);
      }
    }

    if(barPos===1){
      const chance=.20+currentTrack.density*.34+intensity*.12;
      if(Math.random()<chance){
        const note=currentBarChord[(gameChordIdx+1)%currentBarChord.length]*(currentBarBright?4:2);
        playTrackPluck(note,.05,currentBarBright?.021:.018,currentTrack);
      }
    }

    if(barPos===2){
      if(Math.random()<.22+currentTrack.density*.52+intensity*.18){
        playTrackBass(currentBarChord[0]/2*(currentTrack.style==='neon'?1.5:1),0,.042+intensity*.018,currentTrack,trackBeatMs(currentTrack));
      }
      if(Math.random()<.20+currentTrack.density*.42){
        const note=currentBarChord[Math.floor(Math.random()*currentBarChord.length)]*(currentBarBright?4:2);
        playTrackPluck(note,.02,currentBarBright?.023:.026,currentTrack);
      }
    }

    if(barPos===3&&currentTrack.style!=='space'){
      if(Math.random()<.16+currentTrack.density*.45){
        const note=currentBarChord[Math.floor(Math.random()*currentBarChord.length)]*3;
        playTrackPluck(note,.04,currentBarBright?.018:.017,currentTrack);
      }
    }

    // Each track keeps the shop upbeat in a different way without becoming a
    // completely separate song, preserving a smooth scene transition.
    if(currentBarBright){
      const arpIndex=beatCount%currentBarChord.length;
      const arp=currentBarChord[arpIndex]*4;
      const arpGain=currentTrack.style==='space'?.010:.014+currentTrack.density*.006;
      playTrackPluck(arp,.01,arpGain,currentTrack);
    }

    playTrackPerc(currentTrack,barPos);

    beatCount++;
    musicTimer=setTimeout(musicStep,trackBeatMs(currentTrack));
  }

  function startMusic(){
    ac();
    startDrone();
    if(musicRunning) return;
    musicRunning=true;
    beatCount=0;
    trackBars=0;
    currentTrackIndex=chooseTrack(false);
    if(currentTrackIndex===lastTrackIndex) currentTrackIndex=(currentTrackIndex+1)%MUSIC_TRACKS.length;
    lastTrackIndex=currentTrackIndex;
    currentTrack=MUSIC_TRACKS[currentTrackIndex];
    gameChordIdx=0;
    intensity=intensityTarget=computeIntensityTarget();
    sceneMix=sceneTarget=(typeof AppState!=='undefined'&&AppState.currentScreen==='SHOP')?1:0;
    trackGain=createTrackBus();
    trackGain.gain.value=.0001;
    trackGain.gain.linearRampToValueAtTime(.88,ac().currentTime+1.4);
    updateDroneLevel();
    musicStep();
  }

  function stopMusic(){
    musicRunning=false;
    if(musicTimer) clearTimeout(musicTimer);
    musicTimer=null;
    if(trackGain&&ctx){
      const old=trackGain;
      const now=ctx.currentTime;
      old.gain.cancelScheduledValues(now);
      old.gain.setValueAtTime(Math.max(.0001,old.gain.value),now);
      old.gain.exponentialRampToValueAtTime(.0001,now+1.8);
      setTimeout(()=>{try{old.disconnect();}catch(e){}},2100);
      trackGain=null;
    }
    updateDroneLevel();
  }

  window.__music = {
    start:startMusic,
    stop:stopMusic,
    next:function(){ if(musicRunning) beginTrackTransition(); },
    getTrack:function(){ return currentTrack ? currentTrack.name : null; },
    tracks:MUSIC_TRACKS.map(t=>t.name)
  };

  // ---------- settings UI ----------
  function pct(v){ return Math.round(v*100); }
  function ensureDecor(){
    const app = document.getElementById('app'); if(!app) return;
    if(!document.querySelector('.felt-quilt')){
      const fq = document.createElement('div'); fq.className='felt-quilt';
      app.insertBefore(fq, app.firstChild);
    }
    if(!document.querySelector('.sparkle-layer')){
      const sl = document.createElement('div'); sl.className='sparkle-layer';
      for(let i=0;i<14;i++){
        const d=document.createElement('div'); d.className='sparkle-dot';
        d.style.left=(Math.random()*94+3)+'%'; d.style.top=(Math.random()*94+3)+'%';
        d.style.animationDelay=(Math.random()*4.5)+'s'; d.style.animationDuration=(3.5+Math.random()*3)+'s';
        sl.appendChild(d);
      }
      app.insertBefore(sl, app.firstChild);
    }
  }
  function ensureSettingsUI(){
    ensureDecor();
    const app = document.getElementById('app'); if(!app) return;
    if(!document.getElementById('settingsFab')){
      const btn=document.createElement('button');
      btn.id='settingsFab'; btn.className='settings-fab'; btn.innerHTML='⚙️';
      btn.onclick=window.openSettingsModal;
      app.appendChild(btn);
    }
  }
  window.openSettingsModal = function(){
    ac(); SFX.modalOpen();
    document.getElementById('settingsModalOverlay')?.remove();
    const app = document.getElementById('app');
    const modal=document.createElement('div');
    modal.className='modal-overlay'; modal.id='settingsModalOverlay';
    modal.innerHTML = `<div class="modal-box settings-box">
      <div class="settings-title">⚙️ SETTINGS</div>
      <div class="settings-toggle-row">
        <span style="font-size:0.75rem;font-weight:800;text-transform:uppercase;letter-spacing:0.4px;">🎶 Chill Music</span>
        <div class="settings-switch ${Settings.musicOn?'on':''}" id="musicSwitch"><div class="knob"></div></div>
      </div>
      <div class="settings-row">
        <div class="settings-row-label"><span>🔊 Master</span><span class="val" id="masterVal">${pct(Settings.master)}%</span></div>
        <input type="range" class="settings-slider" id="masterSlider" min="0" max="100" value="${pct(Settings.master)}">
      </div>
      <div class="settings-row">
        <div class="settings-row-label"><span>🎵 Music</span><span class="val" id="musicVal">${pct(Settings.music)}%</span></div>
        <input type="range" class="settings-slider" id="musicSlider" min="0" max="100" value="${pct(Settings.music)}">
      </div>
      <div class="settings-row">
        <div class="settings-row-label"><span>🔔 Effects</span><span class="val" id="sfxVal">${pct(Settings.sfx)}%</span></div>
        <input type="range" class="settings-slider" id="sfxSlider" min="0" max="100" value="${pct(Settings.sfx)}">
      </div>
      <button class="primary small" onclick="closeSettingsModal()">CLOSE</button>
    </div>`;
    app.appendChild(modal);
    document.getElementById('masterSlider').oninput = e=>{ Settings.master=e.target.value/100; document.getElementById('masterVal').textContent=e.target.value+'%'; applyVol(); saveSettings(); };
    document.getElementById('musicSlider').oninput = e=>{ Settings.music=e.target.value/100; document.getElementById('musicVal').textContent=e.target.value+'%'; applyVol(); saveSettings(); };
    document.getElementById('sfxSlider').addEventListener('change', ()=>SFX.click());
    document.getElementById('sfxSlider').oninput = e=>{ Settings.sfx=e.target.value/100; document.getElementById('sfxVal').textContent=e.target.value+'%'; applyVol(); saveSettings(); };
    document.getElementById('musicSwitch').onclick = ()=>{
      Settings.musicOn = !Settings.musicOn;
      document.getElementById('musicSwitch').classList.toggle('on', Settings.musicOn);
      applyVol(); saveSettings(); SFX.toggle();
      if(Settings.musicOn) startMusic(); else stopMusic();
    };
  };
  window.closeSettingsModal = function(){ SFX.modalClose(); document.getElementById('settingsModalOverlay')?.remove(); };

  const __origRender = window.render;
  window.render = function(){ __origRender(); ensureSettingsUI(); };

  // ---------- wrap gameplay actions with sound ----------
  const __tc = window.toggleCard;
  window.toggleCard = function(i){
    const wasSel = AppState.selectedIndices && AppState.selectedIndices.has(i);
    __tc(i);
    const nowSel = AppState.selectedIndices && AppState.selectedIndices.has(i);
    if(wasSel && !nowSel) SFX.cardDeselect();
  };
  const __shc = window.sortHandClick;
  window.sortHandClick = function(m){ SFX.cardSort(); return __shc(m); };

  const __dh = window.discardHand;
  window.discardHand = function(){
    if(!AppState.isScoring && AppState.discardsLeft>0){
      const sel = AppState.hand.filter((_,i)=>AppState.selectedIndices.has(i));
      if(sel.length===0) SFX.error(); else SFX.cardDiscard();
    }
    return __dh();
  };
  const __ph = window.playHand;
  window.playHand = function(){
    if(!AppState.isScoring){
      const sel = AppState.hand.filter((_,i)=>AppState.selectedIndices.has(i));
      if(sel.length===0 || AppState.handsLeft<=0) SFX.error();
    }
    return __ph();
  };

  const __sb = window.skipBlind;
  window.skipBlind = function(){ SFX.skipBlind(); return __sb(); };
  const __stb = window.startBlind;
  window.startBlind = function(){
    if(AppState.blindIndex===2 && AppState.currentBoss) SFX.bossAppear(); else SFX.blindStart();
    return __stb();
  };

  ['sellJoker','sellJokerFromShop','sellManagedJoker'].forEach(name=>{
    if(typeof window[name]==='function'){ const orig=window[name]; window[name]=function(i){ SFX.sell(); return orig(i); }; }
  });
  ['openShopPack'].forEach(name=>{
    if(typeof window[name]==='function'){ const orig=window[name]; window[name]=function(){ SFX.packOpen(); return orig.apply(this,arguments); }; }
  });
  ['confirmPack'].forEach(name=>{
    if(typeof window[name]==='function'){ const orig=window[name]; window[name]=function(){ SFX.packChoose(); return orig.apply(this,arguments); }; }
  });
  ['skipPack'].forEach(name=>{
    if(typeof window[name]==='function'){ const orig=window[name]; window[name]=function(){ SFX.packSkip(); return orig.apply(this,arguments); }; }
  });
  ['togglePackChoice'].forEach(name=>{
    if(typeof window[name]==='function'){ const orig=window[name]; window[name]=function(){ SFX.click(); return orig.apply(this,arguments); }; }
  });
  ['rerollShop','rerollReworkedShop'].forEach(name=>{
    if(typeof window[name]==='function'){ const orig=window[name]; window[name]=function(){ SFX.reroll(); return orig.apply(this,arguments); }; }
  });
  ['confirmTargets'].forEach(name=>{
    if(typeof window[name]==='function'){ const orig=window[name]; window[name]=function(){ SFX.consumableUse(); return orig.apply(this,arguments); }; }
  });
  ['cancelTargets'].forEach(name=>{
    if(typeof window[name]==='function'){ const orig=window[name]; window[name]=function(){ SFX.modalClose(); return orig.apply(this,arguments); }; }
  });
  ['openConsumableTargeting','carouselNext','carouselPrev','viewDeck','viewHandLevels','backFromInfo','showJokerModal','restartGame','continueSavedRun','nextRound','continueEndless','newRunFromVictory'].forEach(name=>{
    if(typeof window[name]==='function'){ const orig=window[name]; window[name]=function(){ SFX.click(); return orig.apply(this,arguments); }; }
  });
  ['startRun','advanceToNextAnte'].forEach(name=>{
    if(typeof window[name]==='function'){ const orig=window[name]; window[name]=function(){ SFX.newAnte(); return orig.apply(this,arguments); }; }
  });
  if(typeof window.collectReward==='function'){ const orig=window.collectReward; window.collectReward=function(a){ SFX.chip(); return orig(a); }; }

  const __rro = window.renderRoundOver;
  window.renderRoundOver = function(){ SFX.roundWin(); return __rro(); };
  const __rgo = window.renderGameOver;
  window.renderGameOver = function(){ SFX.gameOver(); return __rgo(); };
  if(typeof window.renderVictory==='function'){ const orig=window.renderVictory; window.renderVictory=function(){ SFX.victory(); return orig(); }; }

  const __sm = window.showModal;
  window.showModal = function(title,msg){
    if(['❌','🔒','🔔','📦'].includes(title)) SFX.error(); else SFX.modalOpen();
    return __sm(title,msg);
  };

  const __iaas = window.initAudioAndStart;
  window.initAudioAndStart = function(){
    ac(); applyVol();
    if(Settings.musicOn) startMusic();
    return __iaas();
  };
})();

// Initial render
render();
</script>
</body>
</html>
