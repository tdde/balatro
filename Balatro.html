// =========================================================================
// PROFILE / UNLOCKS / RUN SAVE
// =========================================================================
const PROFILE_KEY='balatro_profile_v2';
const RUN_SAVE_KEY='balatro_run_v2';
function defaultProfile(){return {unlockedDecks:['red'],unlockedStakes:{red:['white']},collection:{jokers:[],tarots:[],planets:[],spectrals:[],vouchers:[],bosses:[]},stats:{runsPlayed:0,runsWon:0,bestAnte:1,bestScore:0}};}
let Profile=defaultProfile();
function loadProfile(){try{const p=JSON.parse(localStorage.getItem(PROFILE_KEY)||'null');if(p)Profile={...defaultProfile(),...p,unlockedStakes:p.unlockedStakes||{red:['white']},collection:p.collection||defaultProfile().collection,stats:p.stats||defaultProfile().stats};}catch(e){Profile=defaultProfile();}}
function saveProfile(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(Profile));}catch(e){}}
function discover(type,id){if(!id)return;const a=Profile.collection[type]||[];if(!a.includes(id)){a.push(id);Profile.collection[type]=a;saveProfile();}}
function collectionCount(){return Object.values(Profile.collection).reduce((n,a)=>n+a.length,0);}
const DECK_UNLOCKS={
 red:()=>true, blue:()=>collectionCount()>=20, yellow:()=>collectionCount()>=50, green:()=>collectionCount()>=75, black:()=>collectionCount()>=100,
 magic:()=>Profile.stats.runsWon>=1, nebula:()=>Profile.stats.winsByDeck?.blue>=1, ghost:()=>Profile.stats.winsByDeck?.yellow>=1,
 abandoned:()=>Profile.stats.winsByDeck?.green>=1, checkered:()=>Profile.stats.winsByDeck?.black>=1, zodiac:()=>Profile.stats.redStakeWins>=1,
 painted:()=>Profile.stats.greenStakeWins>=1, anaglyph:()=>Profile.stats.blackStakeWins>=1, plasma:()=>Profile.stats.blueStakeWins>=1, erratic:()=>Profile.stats.orangeStakeWins>=1
};
function isDeckUnlocked(id){return !!(DECK_UNLOCKS[id]?.()||id==='red');}
function isStakeUnlocked(deck,stake){const order=StakeRegistry.map(s=>s.id), idx=order.indexOf(stake);if(idx===0)return true;const arr=Profile.unlockedStakes[deck]||['white'];return arr.includes(stake);}
function unlockAfterWin(deck,stake){Profile.stats.runsWon=(Profile.stats.runsWon||0)+1;Profile.stats.winsByDeck=Profile.stats.winsByDeck||{};Profile.stats.winsByDeck[deck]=(Profile.stats.winsByDeck[deck]||0)+1;const order=StakeRegistry.map(s=>s.id),i=order.indexOf(stake);Profile.unlockedStakes[deck]=Profile.unlockedStakes[deck]||['white'];if(i>=0&&i<order.length-1&&!Profile.unlockedStakes[deck].includes(order[i+1]))Profile.unlockedStakes[deck].push(order[i+1]);if(stake==='red')Profile.stats.redStakeWins=(Profile.stats.redStakeWins||0)+1;if(stake==='green')Profile.stats.greenStakeWins=(Profile.stats.greenStakeWins||0)+1;if(stake==='black')Profile.stats.blackStakeWins=(Profile.stats.blackStakeWins||0)+1;if(stake==='blue')Profile.stats.blueStakeWins=(Profile.stats.blueStakeWins||0)+1;if(stake==='orange')Profile.stats.orangeStakeWins=(Profile.stats.orangeStakeWins||0)+1;saveProfile();}
function serializeRun(){return JSON.stringify({version:2,rng:_rngState,counters:{c:_nextCardUID,j:_nextJokerUID,co:_nextConsumableUID},state:{...AppState,selectedIndices:[...AppState.selectedIndices],disabledJokers:[...AppState.disabledJokers],facedownJokers:[...AppState.facedownJokers],handLevels:{...AppState.handLevels},stats:JSON.parse(JSON.stringify(AppState.stats)),currentBoss:AppState.currentBoss?.id||null}});}
function saveRun(){if(AppState.currentScreen==='BOOT'||AppState.isScoring)return;try{localStorage.setItem(RUN_SAVE_KEY,serializeRun());}catch(e){}}
function clearRunSave(){try{localStorage.removeItem(RUN_SAVE_KEY);}catch(e){}}
function hasSavedRun(){try{return !!localStorage.getItem(RUN_SAVE_KEY);}catch(e){return false;}}
function loadSavedRun(){try{const raw=localStorage.getItem(RUN_SAVE_KEY);if(!raw)return false;const x=JSON.parse(raw);if(x.version!==2)return false;_rngState=x.rng;_nextCardUID=x.counters.c;_nextJokerUID=x.counters.j;_nextConsumableUID=x.counters.co;const st=x.state;Object.keys(st).forEach(k=>{if(!['selectedIndices','disabledJokers','facedownJokers','currentBoss'].includes(k))AppState[k]=st[k];});AppState.selectedIndices=new Set(st.selectedIndices||[]);AppState.disabledJokers=new Set(st.disabledJokers||[]);AppState.facedownJokers=new Set(st.facedownJokers||[]);AppState.currentBoss=st.currentBoss?BlindRegistry.find(b=>b.id===st.currentBoss):null;return true;}catch(e){clearRunSave();return false;}}
function decorateShopJoker(j){const out=createJokerInstance(j.id);if(AppState.stakeId==='black'&&rng()<0.3)out.eternal=true;if(AppState.stakeId==='orange'&&rng()<0.3){out.perishable=true;out.perishableRounds=5;}if(AppState.stakeId==='gold'&&rng()<0.3){out.rental=true;}return out;}

// Override run setup with persistent unlocks and a deterministic seedable run.
const _startRunOriginal=startRun;
window.startRun=function(){const deck=DeckRegistry[AppState.deckCarouselIndex];const stake=StakeRegistry[AppState.stakeCarouselIndex];if(!isDeckUnlocked(deck.id)||!isStakeUnlocked(deck.id,stake.id)){showModal('🔒','That deck or stake is locked.');return;}Profile.stats.runsPlayed=(Profile.stats.runsPlayed||0)+1;saveProfile();_startRunOriginal();AppState.rentalJokersEnabled=stake.id==='gold';AppState.perishableJokersEnabled=stake.id==='orange';AppState.eternalJokersEnabled=stake.id==='black';saveRun();};

// Replace run-init renderer so locked content is visible but not selectable.
const _renderRunInitOriginal=renderRunInit;
window.renderRunInit=function(){
 const d=DeckRegistry[AppState.deckCarouselIndex]||DeckRegistry[0], st=StakeRegistry[AppState.stakeCarouselIndex]||StakeRegistry[0];
 if(!isDeckUnlocked(d.id))AppState.deckCarouselIndex=DeckRegistry.findIndex(x=>isDeckUnlocked(x.id));
 if(!isStakeUnlocked(d.id,st.id))AppState.stakeCarouselIndex=0;
 const cd=DeckRegistry[AppState.deckCarouselIndex], cs=StakeRegistry[AppState.stakeCarouselIndex];
 screenContainer.innerHTML=`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px"><h2 style="color:var(--gold);text-align:center">SELECT DECK</h2><div class="carousel-container"><button class="carousel-nav" onclick="carouselPrev('deck')">◀</button><div class="carousel-viewport"><div class="carousel-item"><span class="carousel-icon">${cd.icon}</span><span class="carousel-name">${cd.name}</span><span class="carousel-desc">${cd.desc}</span><span class="lock-hint">${isDeckUnlocked(cd.id)?'Unlocked':'Locked'}</span></div></div><button class="carousel-nav" onclick="carouselNext('deck')">▶</button></div><h2 style="color:var(--gold);text-align:center">SELECT STAKE</h2><div class="carousel-container"><button class="carousel-nav" onclick="carouselPrev('stake')">◀</button><div class="carousel-viewport"><div class="carousel-item"><span class="carousel-icon">${cs.icon}</span><span class="carousel-name">${cs.name}</span><span class="carousel-desc">${cs.desc}</span><span class="lock-hint">${isStakeUnlocked(cd.id,cs.id)?'Unlocked':'Locked'}</span></div></div><button class="carousel-nav" onclick="carouselNext('stake')">▶</button></div><button class="primary" onclick="startRun()">START RUN</button>${hasSavedRun()?'<button onclick="continueSavedRun()">CONTINUE SAVED RUN</button>':''}<button class="small danger" onclick="resetProgress()">RESET PROGRESS</button></div>`;
};
window.continueSavedRun=()=>{if(loadSavedRun()){render();}else showModal('❌','Saved run could not be loaded.');};
window.resetProgress=()=>{Profile=defaultProfile();saveProfile();clearRunSave();AppState.currentScreen='RUN_INIT';render();};

// Shop upgrades and stake stickers.
const _generateShopOriginal=generateShopItems;
window.generateShopItems=function(){let items=_generateShopOriginal();const multT=AppState.vouchers.includes('tarottycoon')?4:AppState.vouchers.includes('tarotmerchant')?2:1;const multP=AppState.vouchers.includes('planettycoon')?4:AppState.vouchers.includes('planetmerchant')?2:1;for(let i=0;i<Math.max(0,multT-1);i++){const t=randPick(Object.values(TarotDefinitions));items.push({kind:'tarot',defId:t.id,cost:0,name:t.name,icon:t.icon,desc:t.desc});}for(let i=0;i<Math.max(0,multP-1);i++){const q=randPick(Object.values(PlanetDefinitions));items.push({kind:'planet',defId:q.id,cost:0,name:q.name,icon:q.icon,desc:`Level up ${q.hand}`});}return items.slice(0,6+(AppState.vouchers.includes('overstockplus')?2:AppState.vouchers.includes('overstock')?1:0));};

// Buy wrapper applies editions, seals and stake stickers without allowing overspending.
const _buyItemOriginal=buyItem;
window.buyItem=function(i){const item=AppState.shopItems[i];if(!item)return;const before=AppState.jokers.length;_buyItemOriginal(i);if(item.kind==='joker'&&AppState.jokers.length>before){const j=AppState.jokers[AppState.jokers.length-1];if(AppState.stakeId==='black'&&rng()<0.3)j.eternal=true;if(AppState.stakeId==='orange'&&rng()<0.3){j.perishable=true;j.perishableRounds=5;}if(AppState.stakeId==='gold'&&rng()<0.3)j.rental=true;discover('jokers',j.defId);}};
const _sellOriginal=sellJokerFromShop;
window.sellJokerFromShop=function(i){const j=AppState.jokers[i];if(j?.eternal){showModal('♾️','Eternal Jokers cannot be sold.');return;}if(j?.defId==='luchador'&&AppState.blindIndex===2){AppState.currentBoss=null;AppState.verdantLeafActive=false;}const before=AppState.jokers.length;_sellOriginal(i);if(AppState.jokers.length<before){const camp=AppState.jokers.find(x=>x.defId==='campfire');if(camp)camp.state.value=(camp.state.value||1)+0.25;}};

// Dynamic reroll price and Chaos free reroll.
const _rerollOriginal=rerollShop;
window.rerollShop=function(){const chaos=hasAbility('chaos');if(chaos&&!AppState.shopRerolled){AppState.shopRerolled=true;AppState.shopItems=[];renderShop();return;}const cost=AppState.vouchers.includes('rerollglut')?0:AppState.vouchers.includes('reroll')?1:2;if(AppState.money>=cost){AppState.money-=cost;AppState.shopItems=[];AppState.shopRerolled=true;renderShop();}};

// Perishable/rental processing at round end.
const _renderRoundOverOriginal=renderRoundOver;
window.renderRoundOver=function(){_renderRoundOverOriginal();AppState.jokers.forEach(j=>{if(j.perishable&&j.perishableRounds!==undefined)j.perishableRounds--;if(j.rental)AppState.money-=3;});saveRun();};

// Win / Endless transition.
const _collectRewardOriginal=collectReward;
window.collectReward=function(amount){const wasFinal=AppState.ante===8&&AppState.blindIndex===2&&!AppState.isEndlessMode;if(wasFinal){AppState.money+=amount;AppState.blindStatus[2]=true;AppState.runStatus='victory';AppState.currentScreen='VICTORY';Profile.stats.bestAnte=Math.max(Profile.stats.bestAnte||1,8);Profile.stats.bestScore=Math.max(Profile.stats.bestScore||0,AppState.totalScore);unlockAfterWin(AppState.deckId,AppState.stakeId);clearRunSave();render();return;} _collectRewardOriginal(amount);if(AppState.ante>8)AppState.isEndlessMode=true;saveRun();};
function renderVictory(){screenContainer.innerHTML=`<div class="overlay"><div style="font-size:2.6rem;">🏆</div><h2 style="color:var(--gold)">RUN COMPLETE!</h2><p style="opacity:0.85;">Ante 8 defeated</p><div class="stat-row"><span>Final Score</span><span style="color:var(--gold);font-family:var(--f-num);">${AppState.totalScore.toLocaleString()}</span></div><button class="primary" onclick="continueEndless()">CONTINUE IN ENDLESS</button><button onclick="newRunFromVictory()">NEW RUN</button></div>`;}
window.continueEndless=()=>{AppState.isEndlessMode=true;AppState.runStatus='in_progress';AppState.ante=9;AppState.blindIndex=0;AppState.blindStatus=[false,false,false];AppState.currentBoss=null;AppState.currentScreen='SHOP';render();saveRun();};
window.newRunFromVictory=()=>{clearRunSave();AppState.currentScreen='RUN_INIT';render();};

// Make the render loop aware of the victory screen and save stable checkpoints.
const _renderFinal=render;
window.render=function(){_renderFinal();if(['PLAYER_DECISION','BLIND_SELECT','SHOP','ROUND_OVER','VICTORY'].includes(AppState.currentScreen))saveRun();};

loadProfile();


// =========================================================================
// SNAPSHOT TEST HARNESS (Phase 0)
// Verifies resolver purity for preview and specific interactions
// =========================================================================
function runSnapshotTests() {
  const results = [];
  const card = (rank, suit, opts) => {
    const c = createCard(rank, suit, opts || {});
    return c;
  };

  // Test 1: Preview doesn't mutate AppState
  const savedMoney = AppState.money;
  const savedHand = AppState.hand.slice();
  const savedJokers = AppState.jokers.slice();
  const savedStats = JSON.stringify(AppState.stats);
  const testHand = [card('A','♠'), card('A','♥'), card('K','♦'), card('K','♣')];
  resolveHand(testHand, true);
  if (AppState.money !== savedMoney) results.push('❌ Preview mutated money');
  if (AppState.hand.length !== savedHand.length) results.push('❌ Preview mutated hand');
  if (JSON.stringify(AppState.stats) !== savedStats) results.push('❌ Preview mutated stats');
  if (AppState.jokers.length !== savedJokers.length) results.push('❌ Preview mutated jokers');

  // Test 2: Stone card always scores
  const stoneHand = [card('A','♠'), card('A','♥'), card('2','♣', { enhancement: 'stone' }), card('7','♦'), card('9','♠')];
  const cls = classifyHand(stoneHand);
  const stoneIncluded = stoneHand.some(c => c.enhancement === 'stone' && cls.scoringUids.has(c.uid));
  if (!stoneIncluded) results.push('❌ Stone card not in scoringUids');

  // Test 3: Hack ability is not treated as boolean
  if (typeof findAbilities('retriggerLowRanks') !== 'object') results.push('❌ findAbilities not returning array');

  // Test 4: Disabled Joker excluded
  AppState.jokers = [];
  const j1 = createJokerInstance('hack');
  AppState.jokers = [j1];
  const beforeDisable = getActiveJokers().length;
  AppState.disabledJokers.add(j1.uid);
  const afterDisable = getActiveJokers().length;
  if (beforeDisable !== 1 || afterDisable !== 0) results.push('❌ Disabled Joker not excluded from getActiveJokers');
  AppState.jokers = [];
  AppState.disabledJokers = new Set();

  // Test 5: Wild card flush detection
  const wildHand = [card('2','♠'), card('3','♠'), card('4','♠', { enhancement: 'wild' }), card('5','♠'), card('6','♠')];
  const wildCls = classifyHand(wildHand);
  if (wildCls.name !== 'Straight Flush' && wildCls.name !== 'Flush' && wildCls.name !== 'Straight') {
    results.push(`❌ Wild flush misclassified as ${wildCls.name}`);
  }

  return results;
}

// Run validation + tests on boot
const validation = (() => {
  const defs = Object.values(JokerDefinitions);
  const ids = new Set(defs.map(d => d.id));
  const names = new Set(defs.map(d => d.name));
  const dupNames = defs.map(d => d.name).filter((n,i,arr) => arr.indexOf(n) !== i);
  const noHandler = defs.filter(d => !JokerHandlers[d.effect]);
  return { total: defs.length, uniqueIds: ids.size, uniqueNames: names.size, dupNames: [...new Set(dupNames)], noHandler: noHandler.map(d => d.effect) };
})();
console.log('Registry validation:', validation);

const testResults = runSnapshotTests();
if (testResults.length > 0) {
  console.error('Snapshot tests FAILED:', testResults);
} else {
  console.log('✅ All snapshot tests passed');
}

// Expose for debugging
window.__balatro = {
  AppState, JokerDefinitions, JokerHandlers, BossHandlers,
  validateRegistries: () => validation,
  runSnapshotTests,
  resolveHand, classifyHand,
  getActiveJokers, findAbilities, hasAbility, getAbility,
};

// Initial render
render();
</script>
